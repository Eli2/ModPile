name: Build
on:
  push:
    branches:
      - master
jobs:
  build-linux:
    runs-on: codeberg-medium
    container:
      image: ubuntu:25.10
    steps:
    - name: prepare
      run: |
        apt-get update -y
        apt-get install -y git nodejs
      env:
        DEBIAN_FRONTEND: noninteractive
    - name: checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: install
      run: |
        bash .forgejo/workflows/install_debian_deps.sh
      env:
        DEBIAN_FRONTEND: noninteractive
    - name: configure
      run: |
        cmake --version
        cmake -B build -DCMAKE_BUILD_TYPE=Release
    - name: build
      run: |
        cmake --build build
    - name: test
      run: |
        ctest --test-dir build
