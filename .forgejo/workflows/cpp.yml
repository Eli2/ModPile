name: Build
on:
  push:
    branches:
      - master
jobs:
  build-ubuntu:
    runs-on: codeberg-medium
    container:
      image: ubuntu:25.10
    steps:
    - name: prepare
      run: |
        apt-get update -y
        apt-get install -y git nodejs
      env:
        DEBIAN_FRONTEND: noninteractive
    - name: checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: install
      run: |
        bash .forgejo/workflows/install_deps_from_readme.sh
    - name: configure
      run: |
        cmake --version
        cmake -B build -DCMAKE_BUILD_TYPE=Release
    - name: build
      run: |
        cmake --build build
    - name: test
      run: |
        ctest --test-dir build

  build-archlinux:
    runs-on: codeberg-medium
    container:
      image: archlinux:latest
    steps:
    - name: prepare
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm --needed git nodejs
    - name: checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: install
      run: |
        bash .forgejo/workflows/install_deps_from_readme.sh
    - name: configure
      run: |
        cmake --version
        cmake -B build -DCMAKE_BUILD_TYPE=Release \
          -DMODPILE_USE_SYSTEM_EBUR128=OFF \
          -DMODPILE_USE_SYSTEM_KISSFFT=OFF
    - name: build
      run: |
        cmake --build build
    - name: test
      run: |
        ctest --test-dir build
