name: Build
on:
  push:
    branches:
      - master
jobs:
  build-ubuntu:
    runs-on: codeberg-medium
    container:
      image: ubuntu:25.10
    steps:
    - name: prepare
      run: |
        apt-get update -y
        apt-get install -y git nodejs
      env:
        DEBIAN_FRONTEND: noninteractive
    - name: checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: install
      run: |
        bash .forgejo/workflows/install_deps_from_readme.sh
    - name: configure
      run: |
        cmake --version
        bash .forgejo/workflows/configure_from_readme.sh ubuntu
    - name: build
      run: |
        cmake --build build -j4
    - name: test
      run: |
        ctest --test-dir build

  build-arch:
    runs-on: codeberg-medium
    container:
      image: archlinux:latest
    steps:
    - name: prepare
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm --needed git nodejs
    - name: checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: install
      run: |
        bash .forgejo/workflows/install_deps_from_readme.sh
    - name: configure
      run: |
        cmake --version
        bash .forgejo/workflows/configure_from_readme.sh arch
    - name: build
      run: |
        cmake --build build -j4
    - name: test
      run: |
        ctest --test-dir build

  build-fedora:
    runs-on: codeberg-medium
    container:
      image: fedora:latest
    steps:
    - name: prepare
      run: |
        dnf install -y git nodejs
    - name: checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: install
      run: |
        bash .forgejo/workflows/install_deps_from_readme.sh
    - name: configure
      run: |
        cmake --version
        bash .forgejo/workflows/configure_from_readme.sh fedora
    - name: build
      run: |
        cmake --build build -j4
    - name: test
      run: |
        ctest --test-dir build
